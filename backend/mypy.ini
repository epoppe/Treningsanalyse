[mypy]
python_version = 3.12
ignore_missing_imports = True
explicit_package_bases = True
warn_unused_ignores = True
show_error_codes = True
pretty = True

# Gradvis type-sjekking: start med database/config (rent nok til å feile på regresjoner).
# Utvid listen etter hvert som flere moduler type-sjekkes.
files = app/database,app/config.py

[mypy-alembic.*]
ignore_missing_imports = True
