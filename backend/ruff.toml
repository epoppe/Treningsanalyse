# Ruff-konfigurasjon for Treningsanalyse.
# Startstramt: kritiske feil som skal feile CI.
# Utvid select gradvis etter hvert som kodebasen ryddes.

target-version = "py312"
line-length = 120
src = ["app", "tests"]

[lint]
# E9: runtime syntax, F63/F7/F82: kritiske pyflakes (undefined names, etc.)
select = ["E9", "F63", "F7", "F82"]

[lint.per-file-ignores]
"tests/*" = ["F821"]
