name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff · mypy · pytest · migrate · smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check app/

      - name: MyPy
        run: mypy

      - name: Migration test (alembic upgrade head + unit tests)
        env:
          PYTHONPATH: .
        run: |
          rm -f /tmp/ci-migrate.db
          DATABASE_URL="sqlite:////tmp/ci-migrate.db" alembic upgrade head
          DATABASE_URL="sqlite:////tmp/ci-migrate.db" alembic current
          python -m pytest tests/test_alembic_migrations.py -v

      - name: Pytest (CI suite)
        env:
          PYTHONPATH: .
          SKIP_GARMIN_INIT: "true"
        run: |
          # Kjører stabile, trackede tester. Kjente app-logic-feil (performance metrics m.m.)
          # er bevisst utenfor denne suiten — se AGENTS.md.
          python -m pytest \
            tests/test_alembic_migrations.py \
            tests/test_garmin_auth.py \
            tests/test_telegram_notifier.py \
            tests/test_activity_data_validation.py \
            tests/test_metric_catalog_units.py \
            tests/test_garmin_client_sync.py \
            -v --tb=short

      - name: API smoke test
        env:
          SKIP_GARMIN_INIT: "true"
        run: bash scripts/ci_smoke_api.sh

  frontend:
    name: Frontend (eslint · tsc · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Next.js build
        run: npm run build
